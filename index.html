<!DOCTYPE html>

<html lang="en">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SharedSpace</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
    
<!-- Displays the home screen -->
<div class="homeContainer">


  <!-- Drawing of logo in svg-->
  <svg 
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 100 100" 
    class="mainStar"
  >
    <path 
      fill="currentColor" 
        d="
        M 50,0 
        C 50,35 59,50 90,50 
        C 59,50 50,65 50,100 
        C 50,65 41,50 10,50 
        C 41,50 50,35 50,0 
        Z
      " 
    />

    <text id="clickText" x="50" y="50" dy="0.35em" text-anchor="middle" font-size="3" font-family="sans-serif" fill="white" stroke="none">click</text>
    <text id="againText" x="50" y="50" dy="0.35em" text-anchor="middle" font-size="3" font-family="sans-serif" fill="white" stroke="none">again</text>

    </svg>
<!-- Login info is displayed once the star is clicked -->
    <div class="login">
    <input id="username" type="text" name="username" placeholder="Enter username" required>
    <input id="password" type="password" name="password" placeholder="Enter password" required> 
    </div>

<!-- Removed text
    <div class="homeText">
    <h2 id="homeTextTop">
        Strangers in one place;
    </h2>
    <h2 id="homeTextBottom">
        Community must be in place.
    </h2>
    </div>
-->
</div>

<!-- Area where the tree is displayed -->
 
<div id="treeContainer">

    <!-- JavaScript draws the branches and images here -->
    <svg id="tree">
        <defs>
    <path id="starShape"
      d="
        M 50,0
        C 50,35 59,50 90,50
        C 59,50 50,65 50,100
        C 50,65 41,50 10,50
        C 41,50 50,35 50,0
        Z
      "
    />
    </defs>
    </svg>

</div>

<div id="zoomedContainer">
    <div id="photoStack">
    <img id="highlight">

    <div id="reactionBar">
      <div id="reactionList"></div>
      <button id="addReaction">+</button>
    </div>

    <div id="emojiPicker">
      <emoji-picker class="dark"></emoji-picker>
    </div>
  </div>


  <img id="mnDownLeftArrow" src="images/missingno.png">
  <img id="mnDownRightArrow" src="images/missingno.png">
  <img id="downRightArrow" src="images/arrow.png">
  <img id="downLeftArrow" src="images/arrow.png">
  <img id="rightArrow" src="images/arrow.png">
  <img id="mnRightArrow" src="images/missingno.png">
  <img id="leftArrow" src="images/arrow.png">
  <img id="mnLeftArrow" src="images/missingno.png">
 <img id="upSecondArrow" src="images/arrow.png">
  <img id="upArrow" class="upCenter" src="images/arrow.png">
  <img id="mnUpArrow" src="images/missingno.png">
  <img id="downArrow" src="images/arrow.png">
  <img id="mnDownArrow" src="images/missingno.png">
  <img id="exit" src="images/exit.png">

</div>

<!-- Hidden photo picker... -->
<input
    type="file"
    id="fileInput"
    accept="image/*"
    capture="environment"
>

<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.29.1/index.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="script.js"></script>

</body>

</html>
